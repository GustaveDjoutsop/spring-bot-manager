# Local development overrides
# Activated automatically when SPRING_PROFILES_ACTIVE=local

# Server
server.port=8090
management.server.port=8081

# Redis (optional)
# If Redis isn't running, the app will fall back to in-memory caching automatically.
spring.data.redis.url=redis://localhost:6379

# PostgreSQL (local via docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:15432/smartbot
spring.datasource.username=smartbot
spring.datasource.password=smartbot

# WhatsApp global defaults (single-app)
whatsapp.verify-signature=false
whatsapp.app-secret=3d9xxxx
whatsapp.api.version=v20.0
whatsapp.api.base-url=https://graph.facebook.com

# WhatsApp per-bot app secrets (multi Meta apps)
# These are used to validate X-Hub-Signature-256 for the bot matched by metadata.phone_number_id
whatsapp.app-secret.laundry=f2805cxxx
whatsapp.app-secret.thomasnetwork=f2601cxxx

# Webhook verify tokens (per-bot, loaded from env vars in production)
VERIFY_TOKEN_LAUNDRY=myTester
VERIFY_TOKEN_THOMASNETWORK=myTestToken

# WhatsApp per-bot access tokens
# Either set env vars:
# - WHATSAPP_ACCESS_TOKEN_LAUNDRY
# - WHATSAPP_ACCESS_TOKEN_THOMASNETWORK
# Or set Spring properties here:
whatsapp.access-token.
whatsapp.access-token.


